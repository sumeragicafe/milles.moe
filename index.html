<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>milles.moe</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'Terminus';
            src: url('./fonts/TerminusTTF-4.49.3.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0a0a0a;
            color: #fff;
            font-family: 'Terminus', 'Roboto', monospace;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .crt {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a0a;
        }

        .crt::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                repeating-linear-gradient(
                    0deg,
                    rgba(0, 0, 0, 0.15) 0px,
                    rgba(0, 0, 0, 0.15) 1px,
                    transparent 1px,
                    transparent 2px
                );
            pointer-events: none;
            z-index: 10;
        }

        .crt::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                repeating-linear-gradient(
                    0deg,
                    transparent 0px,
                    transparent 1px,
                    rgba(255, 255, 255, 0.015) 1px,
                    rgba(255, 255, 255, 0.015) 2px
                );
            pointer-events: none;
            z-index: 11;
            animation: scanline-scroll 0.08s linear infinite;
        }

        .crt-flicker {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 12;
            animation: flicker 0.05s infinite;
        }

        .crt-flicker::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                180deg,
                transparent 0%,
                rgba(255, 255, 255, 0.015) 50%,
                transparent 100%
            );
            animation: scan-beam 8s ease-in-out infinite;
        }

        .crt-vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(
                ellipse at center,
                transparent 60%,
                rgba(0, 0, 0, 0.4) 100%
            );
            pointer-events: none;
            z-index: 13;
        }

        .crt-glare {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 14;
            background: 
                linear-gradient(
                    135deg,
                    transparent 30%,
                    rgba(255, 255, 255, 0.008) 50%,
                    transparent 70%
                );
        }

        .crt-noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            animation: noise 0.3s steps(5) infinite;
        }

        @keyframes scanline-scroll {
            0% { transform: translateY(0); }
            100% { transform: translateY(-2px); }
        }

        @keyframes scan-beam {
            0%, 100% { 
                transform: translateY(-100%);
                opacity: 0;
            }
            50% { 
                opacity: 1;
            }
        }

        @keyframes flicker {
            0% { opacity: 0.98; }
            5% { opacity: 0.95; }
            10% { opacity: 0.99; }
            15% { opacity: 0.96; }
            20% { opacity: 0.98; }
            25% { opacity: 0.94; }
            30% { opacity: 0.99; }
            35% { opacity: 0.97; }
            40% { opacity: 0.95; }
            45% { opacity: 0.98; }
            50% { opacity: 0.96; }
            55% { opacity: 0.99; }
            60% { opacity: 0.95; }
            65% { opacity: 0.97; }
            70% { opacity: 0.98; }
            75% { opacity: 0.96; }
            80% { opacity: 0.99; }
            85% { opacity: 0.95; }
            90% { opacity: 0.97; }
            95% { opacity: 0.98; }
            100% { opacity: 0.99; }
        }

        @keyframes noise {
            0%, 100% { transform: translate(0, 0); }
            10% { transform: translate(-0.5%, -0.5%); }
            20% { transform: translate(0.5%, 0.5%); }
            30% { transform: translate(-0.5%, 0.5%); }
            40% { transform: translate(0.5%, -0.5%); }
            50% { transform: translate(-0.5%, 0%); }
            60% { transform: translate(0.5%, 0%); }
            70% { transform: translate(0%, 0.5%); }
            80% { transform: translate(0%, -0.5%); }
            90% { transform: translate(0.5%, 0.5%); }
        }

        h1 {
            font-size: 3rem;
            font-weight: normal;
            color: #ffffff;
            text-shadow: 
                0 0 5px rgba(255, 255, 255, 0.8),
                0 0 10px rgba(255, 255, 255, 0.5),
                0 0 20px rgba(255, 255, 255, 0.3),
                0 0 40px rgba(255, 255, 255, 0.15);
            animation: text-glow 3s ease-in-out infinite alternate, text-flicker 4s linear infinite;
            position: relative;
            z-index: 5;
            letter-spacing: 0.1em;
        }

        @keyframes text-glow {
            0% {
                text-shadow: 
                    0 0 5px rgba(255, 255, 255, 0.8),
                    0 0 10px rgba(255, 255, 255, 0.5),
                    0 0 20px rgba(255, 255, 255, 0.3),
                    0 0 40px rgba(255, 255, 255, 0.15);
            }
            100% {
                text-shadow: 
                    0 0 8px rgba(255, 255, 255, 1),
                    0 0 15px rgba(255, 255, 255, 0.6),
                    0 0 30px rgba(255, 255, 255, 0.4),
                    0 0 60px rgba(255, 255, 255, 0.2);
            }
        }

        @keyframes text-flicker {
            0%, 100% { opacity: 1; }
            92% { opacity: 1; }
            93% { opacity: 0.85; }
            94% { opacity: 1; }
            96% { opacity: 0.9; }
            97% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="crt">
        <div class="crt-noise"></div>
        <h1>milles.moe</h1>
    </div>
    <div class="crt-flicker"></div>
    <div class="crt-vignette"></div>
    <div class="crt-glare"></div>
</body>
</html>
